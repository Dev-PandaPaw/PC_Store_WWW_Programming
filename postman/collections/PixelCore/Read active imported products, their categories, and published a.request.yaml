$kind: http-request
name: Read active imported products, their categories, and published articles
description: Reads PostgreSQL on every request. No local JSON fallback. Existing catalog endpoints remain unchanged. No authentication is required.
url: "{{baseUrl}}/api/catalog/storefront"
method: GET
headers:
  Accept: application/json
settings: {}
examples: ./.resources/Read active imported products, their categories, and published a.resources/examples
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('public storefront responds with JSON', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });
      const data = pm.response.json();
      pm.test('imported catalog covers all 14 PC categories', () => {
        pm.expect(data.products.length).to.be.at.least(34);
        pm.expect(data.categories.length).to.equal(14);
        const slugs = new Set(data.categories.map(c => c.slug));
        data.products.forEach(p => pm.expect(slugs.has(p.category)).to.equal(true));
      });
      pm.test('products use database UUIDs and bundled image keys', () => {
        pm.expect(new Set(data.products.map(p => p.id)).size).to.equal(data.products.length);
        pm.expect(new Set(data.products.map(p => p.slug)).size).to.equal(data.products.length);
        data.products.forEach(p => {
          pm.expect(p.id).to.match(/^[0-9a-f]{8}-[0-9a-f-]{27}$/);
          pm.expect(p.image).to.match(/^products\/[a-z0-9-]+\.(png|jpe?g|webp)$/);
          pm.expect(p.price).to.be.above(0);
          pm.expect(p.originalPrice).to.be.at.least(p.price);
          pm.expect(p.specs.length).to.be.above(0);
          pm.expect(p.stockOnHand).to.be.at.least(0);
        });
      });
      pm.test('four full articles are available inside the storefront', () => {
        pm.expect(data.articles.length).to.be.at.least(4);
        data.articles.forEach(a => {
          pm.expect(a.slug).to.be.a('string');
          pm.expect(a.sections.length).to.be.above(0);
          pm.expect(a.intro.length).to.be.above(0);
          pm.expect(a.relatedCategories.length).to.be.above(0);
        });
      });
